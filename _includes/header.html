<!-- _includes/header.html -->
<header class="site-header">
    <div class="header-container">
        <a href="/" class="logo-title" style="text-decoration: none; color: inherit;" aria-label="DataNova Consulting home">
            <div class="logo">
                <img src="{{ '/assets/images/logo_color.svg' | relative_url }}" alt="DataNova Consulting Logo" width="60" height="60">
            </div>
            <h1 class="site-title">DataNova Consulting<span class="highlight">.</span></h1>
        </a>
        <nav class="main-nav">
            <ul>
                <li>
                    <a href="/#how-it-works" class="nav-link" id="how-link">How It Works</a>
                </li>
                <li>
                    <a href="/#pricing" class="nav-link" id="pricing-link">Pricing</a>
                </li>
                <li>
                    <a href="/#faq" class="nav-link" id="faq-link">FAQ</a>
                </li>
                <li>
                    <a href="tel:+13603996614" class="nav-link" id="demo-link" data-umami-event="demo-call">Demo: (360) 399-6614</a>
                </li>
                <li>
                    <a href="/#contact" class="nav-link" id="contact-link">Contact</a>
                </li>
            </ul>
        </nav>
        <button class="mobile-menu-toggle" aria-label="Toggle mobile menu">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<style>
    /* Tablet widths: five nav items don't fit on one line next to the logo,
       so use the hamburger menu up to 1100px (the stylesheet switches at 768px). */
    @media (min-width: 769px) and (max-width: 1100px) {
        .header-container { flex-wrap: wrap; }
        .main-nav { width: 100%; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; order: 3; }
        .main-nav.show { max-height: 320px; }
        .main-nav ul { flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
        .mobile-menu-toggle { display: block; }
    }
</style>

<script>
    (function () {
        var nav = document.querySelector('.main-nav');
        document.querySelector('.mobile-menu-toggle').addEventListener('click', function () {
            nav.classList.toggle('show');
        });
        // Same-page anchor taps: close the mobile menu so the section is visible.
        nav.querySelectorAll('a').forEach(function (a) {
            a.addEventListener('click', function () { nav.classList.remove('show'); });
        });
    })();
</script>
