<!-- _includes/header.html -->
<header class="site-header">
    <div class="header-container">
        <a href="/" class="logo-title" style="text-decoration: none; color: inherit;" aria-label="DataNova Consulting home">
            <div class="logo">
                <img src="{{ '/assets/images/logo_color.svg' | relative_url }}" alt="DataNova Consulting Logo" width="60" height="60">
            </div>
            <h1 class="site-title">DataNova Consulting<span class="highlight">.</span></h1>
        </a>
        <nav class="main-nav">
            <ul>
                <li>
                    <a href="/ai-receptionist.html" class="nav-link" id="receptionist-link">AI Receptionist</a>
                </li>
                <li>
                    <a href="/contractor-xdates.html" class="nav-link" id="xdates-link">Contractor X-Dates</a>
                </li>
                <li>
                    {% comment %}A page with its own contact section sets contact_href in its front matter.{% endcomment %}
                    <a href="{{ page.contact_href | default: '/#contact' }}" class="nav-link" id="contact-link">Contact</a>
                </li>
            </ul>
        </nav>
        <button class="mobile-menu-toggle" aria-label="Toggle mobile menu">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<style>
    /* The logo and the three nav links need 692px on one line. With the row's 64px of
       padding and up to 17px of scrollbar gutter they touch at about 773px, so the
       hamburger menu stays until 800px, which leaves a gap of at least 28px between them
       (the stylesheet switches at 768px). Three stacked links are 143px tall, well inside
       the 300px open height. */
    @media (min-width: 769px) and (max-width: 800px) {
        .header-container { flex-wrap: wrap; }
        .main-nav { width: 100%; max-height: 0; overflow: hidden; transition: var(--transition); order: 3; }
        .main-nav.show { max-height: 300px; }
        .main-nav ul { flex-direction: column; gap: var(--space-sm); margin-top: var(--space-md); }
        .mobile-menu-toggle { display: block; }
    }
</style>

<script>
    (function () {
        var nav = document.querySelector('.main-nav');
        document.querySelector('.mobile-menu-toggle').addEventListener('click', function () {
            nav.classList.toggle('show');
        });
        // Same-page anchor taps: close the mobile menu so the section is visible.
        nav.querySelectorAll('a').forEach(function (a) {
            a.addEventListener('click', function () { nav.classList.remove('show'); });
        });
    })();
</script>
