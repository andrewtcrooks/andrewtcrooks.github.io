<!-- _includes/header.html -->
<header class="site-header">
    <div class="header-container">
        <div class="logo-title">
            <div class="logo">
                <img src="{{ '/assets/images/logo_color.svg' | relative_url }}" alt="DataNova Consulting Logo" width="60" height="60">
            </div>
            <h1 class="site-title">DataNova Consulting<span class="highlight">.</span></h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li>
                    <a href="/" class="nav-link {% if page.url == '/' %}active{% endif %}" id="home-link">
                        Home
                    </a>
                </li>
                <li>
                    <a href="/after-hours-receptionist.html" class="nav-link {% if page.url == '/after-hours-receptionist.html' %}active{% endif %}" id="receptionist-link">
                        How It Works
                    </a>
                </li>
                <li>
                    <a href="/#pricing" class="nav-link" id="pricing-link">
                        Pricing
                    </a>
                </li>
                <li>
                    <a href="tel:+13603996614" class="nav-link" id="demo-link" data-umami-event="demo-call">
                        Demo: (360) 399-6614
                    </a>
                </li>
                <li>
                    <a href="/contact.html" class="nav-link {% if page.url == '/contact.html' %}active{% endif %}" id="contact-link">
                        Contact
                    </a>
                </li>
            </ul>
        </nav>
        <button class="mobile-menu-toggle" aria-label="Toggle mobile menu">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<script>
    document.querySelector('.mobile-menu-toggle').addEventListener('click', function() {
        document.querySelector('.main-nav').classList.toggle('show');
    });
</script>
